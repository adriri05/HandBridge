; PlatformIO project config for HandBridge glove firmware
; See https://docs.platformio.org/en/latest/projectconf/

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; BLE support comes from the ESP32 Arduino core (ESP32 BLE Arduino / NimBLE-Arduino)
    ; IMU library TBD once IMU model is chosen (e.g. adafruit/Adafruit MPU6050, adafruit/Adafruit BNO055)
